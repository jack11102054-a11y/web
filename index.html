<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魁儡花</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 正方形容器：2048x2048 比例 */
    .interactive-wrapper {
      position: relative;
      width: 90vw;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .interactive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 熱點基礎設定：平時完全隱形無框線，僅保留滑鼠指標 */
    .hotspot {
      pointer-events: auto;
      fill: transparent;
      stroke: none;
      cursor: pointer;
    }

    /* 點擊後產生的瞬間光點效果 (持續 0.1 秒) */
    .click-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      animation: rippleEffect 0.1s linear forwards;
      z-index: 50;
    }

    @keyframes rippleEffect {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* 對話框樣式：15px 字體，黑色背景框，白字 */
    .dialog-box {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      z-index: 100;
    }

    .dialog-box.active {
      bottom: 30px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="interactive-wrapper" id="wrapper">
    <!-- 背景圖片，透過 JavaScript 動態切換 -->
    <img id="bgImage" src="傀儡花_羅妹號.png" alt="魁儡花首頁背景" class="interactive-image">

    <!-- viewBox 設定為 2048 2048，精準對齊像素 -->
    <svg class="hotspot-svg" viewBox="0 0 2048 2048" preserveAspectRatio="none" id="hotspotSvg">
      <!-- 熱點將由 JavaScript 根據當前頁面動態載入 -->
    </svg>

    <!-- 對話框元件 -->
    <div id="dialog" class="dialog-box" onclick="closeDialog()"></div>
  </div>

  <script>
    let timer = null;
    let currentPage = 1; // 預設為首頁一 (羅妹號)

    // 定義各個頁面的背景圖與對應的熱點資料
    const pagesData = {
      1: {
        bg: "傀儡花_羅妹號.png",
        hotspots: [
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "羅妹號", type: "link", target: "序幕.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      2: {
        bg: "傀儡花_琅嶠社寮.png",
        hotspots: [
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "琅嶠社寮", type: "link", target: "社寮（一）.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      3: {
        bg: "傀儡花_斯卡羅.png",
        hotspots: [
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "斯卡羅", type: "link", target: "村落(二).html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      4: {
        bg: "傀儡花_出火.png",
        hotspots: [
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "出火", type: "link", target: "尾聲（三）.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", type: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 }
        ]
      }
    };

    // 渲染當前頁面的背景與熱點
    function renderPage(pageNum) {
      currentPage = pageNum;
      const data = pagesData[pageNum];
      
      // 切換背景圖片
      document.getElementById('bgImage').src = data.bg;

      // 清空並重新生成 SVG 熱點
      const svg = document.getElementById('hotspotSvg');
      svg.innerHTML = '';

      data.hotspots.forEach(item => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "hotspot");
        path.setAttribute("d", item.d);
        
        path.addEventListener('click', (event) => {
          createRipple(event);
          
          if (item.type === "dialog") {
            showDialog(item.text);
          } else if (item.type === "switch") {
            showDialog(item.text);
            setTimeout(() => {
              renderPage(item.page);
            }, item.delay);
          } else if (item.type === "link") {
            showDialog(item.text);
            setTimeout(() => {
              window.location.href = item.target;
            }, item.delay);
          }
        });

        svg.appendChild(path);
      });
    }

    // 產生點擊光點特效
    function createRipple(event) {
      const wrapper = document.getElementById('wrapper');
      const rect = wrapper.getBoundingClientRect();
      
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;

      wrapper.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 100);
    }

    function showDialog(text) {
      const dialog = document.getElementById('dialog');
      dialog.innerText = text;
      dialog.classList.add('active');

      if (timer) clearTimeout(timer);

      // 3 秒後自動隱藏對話框
      timer = setTimeout(() => {
        closeDialog();
      }, 3000);
    }

    function closeDialog() {
      const dialog = document.getElementById('dialog');
      dialog.classList.remove('active');
    }

    // 網頁載入時預設顯示首頁一
    window.onload = function() {
      renderPage(1);
    };
  </script>

</body>
</html>
