  <title>尾聲（三）</title>
  <style>
  /* 移除點擊時的藍色方框 */
  * {
    -webkit-tap-highlight-color: transparent;
  }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 正方形容器：2048x2048 比例 */
    .interactive-wrapper {
      position: relative;
      width: 90vw;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .interactive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 熱點基礎設定：平時完全隱形無框線，僅保留滑鼠指標 */
    .hotspot {
      pointer-events: auto;
      fill: transparent;
      stroke: none;
      cursor: pointer;
    }

    /* 點擊後產生的瞬間光點效果 (持續 0.1 秒) */
    .click-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      animation: rippleEffect 0.1s linear forwards;
      z-index: 50;
    }

    @keyframes rippleEffect {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* 對話框樣式：15px 字體，黑色背景框，白字 */
    .dialog-box {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      z-index: 100;
    }

    .dialog-box.active {
      bottom: 30px;
      opacity: 1;
    }

    /* 右下角「主頁」按鈕樣式：無背景框，12號字體，透明度30%，緊貼右下雙邊 */
    .home-button {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: transparent;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 60;
      transition: color 0.2s;
    }

    .home-button:hover {
      color: rgba(255, 255, 255, 0.8);
    }
  </style>

  <script>
    let timer = null;

    function handleClick(event, element) {
      const text = element.getAttribute('data-text');
      showDialog(text);

      // 產生 0.1 秒的點擊光點回饋
      createRipple(event);
    }

    // 產生點擊光點特效的函式
    function createRipple(event) {
      const wrapper = document.getElementById('wrapper');
      const rect = wrapper.getBoundingClientRect();
      
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;

      wrapper.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 100);
    }

    function showDialog(text) {
      const dialog = document.getElementById('dialog');
      dialog.innerText = text;
      dialog.classList.add('active');

      if (timer) clearTimeout(timer);

      // 3 秒後自動隱藏對話框
      timer = setTimeout(() => {
        closeDialog();
      }, 3000);
    }

    function closeDialog() {
      const dialog = document.getElementById('dialog');
      dialog.classList.remove('active');
    }

 // 主頁按鈕點擊事件：跳轉至首頁
    function handleHomeClick() {
      window.location.href = 'index.html';
    }
  </script>
